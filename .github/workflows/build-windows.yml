name: Build PhonePad for Windows

on:
  push:
    branches:
      - arena/7ea85c15-phonepad
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Build windowed executable
        run: python -m PyInstaller --noconfirm --clean PhonePad.spec

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: PhonePad-Windows
          path: dist/PhonePad.exe
          if-no-files-found: error
          retention-days: 14
