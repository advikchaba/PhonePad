name: Build PhonePad for Windows

on:
  push:
    branches:
      - arena/7ea85c15-phonepad
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Build windowed executable
        run: python -m PyInstaller --noconfirm --clean PhonePad.spec

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhonePad-Windows
          path: dist/PhonePad.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach executable to the preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-preview
          name: PhonePad Desktop UI Preview
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/PhonePad.exe
          body: |
            Windows desktop build of the PhonePad controller UI prototype.

            **Prototype only:** this checkout does not include the gamepad backend, so button presses are visual and are not sent to games.
