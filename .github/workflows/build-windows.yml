name: Build PhonePad for Windows

on:
  push:
    branches:
      - arena/7ea85c15-phonepad
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and publish (for example, 1.02)"
        required: false
        default: desktop-preview
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Build windowed executable
        run: python -m PyInstaller --noconfirm --clean PhonePad.spec

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhonePad-Windows
          path: dist/PhonePad.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach executable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'desktop-preview' }}
          name: ${{ github.event_name == 'push' && 'PhonePad Desktop Preview' || inputs.release_tag == 'desktop-preview' && 'PhonePad Desktop Preview' || format('PhonePad {0}', inputs.release_tag) }}
          prerelease: ${{ github.event_name == 'push' || inputs.release_tag == 'desktop-preview' }}
          make_latest: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != 'desktop-preview' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/PhonePad.exe
          body: |
            Windows desktop app. Connect a phone on the same Wi-Fi network, scan the QR code, and use its inputs as keyboard/mouse controls. No virtual gamepad driver or phone app is required.
